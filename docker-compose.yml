version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: civicshield-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - DATABASE_URL=postgresql+psycopg2://civicshield_user:civicshield_secret_pass@db:5432/civicshield
      - SECRET_KEY=civicshield-production-super-secret-key-change-before-election-launch-32chars
      - CORS_ORIGINS=["http://localhost", "http://localhost:5173", "http://127.0.0.1:5173"]
    volumes:
      - evidence-vault:/app/uploads
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: civicshield-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

  db:
    image: postgres:16-alpine
    container_name: civicshield-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: civicshield_user
      POSTGRES_PASSWORD: civicshield_secret_pass
      POSTGRES_DB: civicshield
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U civicshield_user -d civicshield"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: civicshield-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

volumes:
  postgres-data:
  redis-data:
  evidence-vault:
